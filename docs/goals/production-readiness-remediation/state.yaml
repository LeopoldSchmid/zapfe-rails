tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: xhigh
    objective: "Den vorhandenen 60-Finding-Plan gegen den aktuellen Branch validieren und eine exakte Remediation-Matrix samt Abhängigkeiten, lokalen/externalen Grenzen und sicheren Worker-Slices freigeben."
    inputs:
      - "docs/architecture-review-2026-07-16.md"
      - "docs/goals/production-readiness-architecture-review/state.yaml"
      - "aktueller Branch, Diff und vorhandene Verifikationsbefehle"
    constraints:
      - "Read-only; keine Produktdateien ändern."
      - "Jede der 60 Finding-IDs exakt abbilden."
      - "Nicht mehr aktuelle oder bereits behobene Findings nur mit erneutem Beleg zurückweisen."
      - "Externe Betreiber-/Provider-/Rechtsabhängigkeiten von lokal implementierbaren Maßnahmen trennen."
    expected_output:
      - "60-ID-Remediation-Matrix mit Status, Abhängigkeit und Verifikation"
      - "Kalibrierte Reihenfolge und größte sichere Worker-Slices"
      - "Exakte allowed_files, verify und stop_if für T002"
      - "Liste benötigter Betreiberfakten, Credentials und externer Freigaben"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Alle 60 Findings bleiben auf dem aktuellen Branch offen; der jüngste Commit ergänzt nur die Review-Quest. Die Matrix ordnet jede ID einem kohärenten Paket und einem konkreten Abschlussnachweis zu. T002 ist als größtes sofort sicheres Paket freigegeben; echte Offsite-, Betreiber-, Provider-, Rechts- und Steuernachweise bleiben explizite spätere Abhängigkeiten."
      harness: codex
      note: notes/T001-remediation-matrix.md
      worker_package:
        objective: "Welle 0 lokal vollständig umsetzen: sämtliche aktuellen Runtime-Advisories patchen, das destruktive Produktionsskript technisch fail-closed sperren und ein konsistentes, verschlüsselbares Backup-/Restore-Verfahren mit sicherem isoliertem Restore-Test und Runbook schaffen."
        allowed_files:
          - Gemfile
          - Gemfile.lock
          - bin/brakeman
          - script/replace_prod_storage_from_staging
          - script/backup_storage
          - script/restore_storage
          - test/scripts/production_storage_safety_test.rb
          - documentation/backup_restore.md
          - documentation/testing.md
          - .github/workflows/ci.yml
        verify:
          - "bin/bundler-audit check"
          - "bundle exec brakeman --no-pager"
          - "bin/rails test test/scripts/production_storage_safety_test.rb"
          - "bin/rails test"
          - "isolierter Backup-/Restore-Test mit Wegwerfverzeichnissen, Checksummen und beschädigtem Archiv als Negativfall"
          - "git diff --check"
        stop_if:
          - "Ein Test oder Skript berührt reale, nicht eindeutig temporäre Daten."
          - "Die verfügbaren gepatchten Gemversionen sind unter Ruby 3.4/Rails 8.1 nicht auflösbar oder verlangen eine fachliche Produktänderung."
          - "Verschlüsselung oder Offsite-Upload würde ohne gewähltes Tool/Ziel nur Scheinsicherheit erzeugen; dann lokal exportierbares verschlüsselbares Artefakt liefern und den echten Offsite-Schritt offen halten."
      evidence:
        - docs/architecture-review-2026-07-16.md
        - docs/goals/production-readiness-remediation/notes/T001-remediation-matrix.md
        - Gemfile.lock
        - script/replace_prod_storage_from_staging
        - config/deploy.yml
