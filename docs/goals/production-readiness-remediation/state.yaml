# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Produktionsreife-Remediation"
  slug: "production-readiness-remediation"
  kind: existing_plan
  tranche: "Kontinuierliche vollständige Remediation aller 60 Findings bis zum belegten erneuten Produktionsfreigabeentscheid"
  status: active
  oracle:
    signal: "60-ID-Remediation-Matrix ohne offene kritische/hohe Findings, grüne risikobasierte Release-Gates und bestandener finaler Go/No-Go-Review"
    cadence: "nach jedem Worker-Paket, an Risikogrenzen und beim finalen Audit"
    final_proof: "Receipt-basierte 60-ID-Abdeckung, grüne Security-/Rails-/Browser-/Restore-Gates und full_outcome_complete: true"
  intake:
    original_request: "Alle Findings aus dem Architektur- und Produktionsreife-Review korrigieren."
    interpreted_outcome: "Die geprüfte Webapp wird durch belegte technische, betriebliche und organisatorische Korrekturen produktionsfreigabefähig; keine der 60 Finding-IDs bleibt stillschweigend offen."
    input_shape: existing_plan
    audience: "Betreiber und Entwicklungsteam"
    authority: requested
    proof_type: test
    completion_proof: "Jedes Finding ist belegt abgeschlossen und der erneute Produktionsfreigabecheck besteht mit grünen relevanten Gates."
    likely_misfire: "Kosmetische Codeänderungen als Vollremediation ausgeben, externe Pflichten erfinden oder kritische Betriebs-/Security-Risiken trotz grüner Unit-Tests offenlassen."
    blind_spots_considered:
      - "Providerzugänge, reale Backupziele, Verträge und Produktionsinfrastruktur sind nicht vollständig lokal prüfbar."
      - "Betreiber-, Umsatz-, Mitarbeiter-, Kundenmix- und Vertragsschlussdaten beeinflussen deutsche Rechtspflichten."
      - "Löschung, Aufbewahrung, Backups und Rechnungsarchivierung müssen als zusammenhängender Lebenszyklus umgesetzt werden."
      - "Abhängigkeits-, Auth-, Daten- und Rechnungsänderungen brauchen Negativ-, Failure-, Migrations- und Rollbacktests."
      - "Technische Umsetzung ersetzt keine anwaltliche oder steuerliche Freigabe."
    existing_plan_facts:
      - "Evidenzbasis ist docs/architecture-review-2026-07-16.md mit 60 eindeutigen Finding-IDs."
      - "Welle 0 priorisiert SEC-001, OPS-001 und OPS-002."
      - "Wellen 1 bis 3 ordnen Auth, Privacy/Legal, Reliability, Quality, Accessibility, Performance und PWA."
      - "Arbeit erfolgt auf architecture-review; die temporäre Review-Quest bleibt nicht-produktiv."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "node /home/leo/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.0/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/production-readiness-remediation"

