version: 2

goal:
  title: "Zapfe-Auftragszentrale implementieren"
  slug: "cockpit-implementation"
  kind: existing_plan
  tranche: "Validate the supplied roadmap, then deliver successive verified vertical slices through Phase 3; keep Phase 4 and later work behind their explicit decision gates."
  status: active
  oracle:
    signal: "Tested admin workflows prove the Phase 1–3 exit criteria: inquiry-to-order, offer-to-PDF-and-send, and confirmed-order-to-procurement/tasks/resources."
    cadence: "after each Worker package and at every phase boundary"
    final_proof: "A final Judge/PM audit maps verified workflows, migrations, tests, and roadmap updates to every in-scope Phase 1–3 exit criterion."
  intake:
    original_request: "Read documentation/cockpit_implementation_plan.md, make a structured implementation plan, then implement it step by step while keeping overview of completed, missing, and open work."
    interpreted_outcome: "A transparently tracked, tested implementation of the first usable Zapfe order-management cockpit from the supplied roadmap."
    input_shape: existing_plan
    audience: "Zapfe internal team"
    authority: requested
    proof_type: test
    completion_proof: "Passing model, integration, system/browser tests and a receipt-backed walkthrough satisfy every in-scope Phase 1–3 exit criterion."
    likely_misfire: "Implement isolated tables and forms without a coherent, secure, versioned operational workflow."
    blind_spots_considered:
      - "Existing catalog data and fields need evidence-based migration decisions."
      - "PDF generation, backup/restore, file authorization, and GDPR retention require technical validation."
      - "Phase 4 and 5 contain unresolved business/legal decisions and must not be assumed."
    existing_plan_facts:
      - "The authoritative source plan is documentation/cockpit_implementation_plan.md, dated 2026-07-14."
      - "Phase 1 inquiry/order core, Phase 2 offers/suppliers, and Phase 3 operations/resources are the first usable product."
      - "Rails monolith, Hotwire-first, personal AdminUser accounts, Europe/Berlin, BigDecimal money, and immutable document snapshots are fixed constraints."
      - "Phase 4 invoice/XRechnung and Phase 5 PWA/push require later decision gates."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/cockpit-implementation/"
    command: "node /home/leo/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.0/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/cockpit-implementation"

