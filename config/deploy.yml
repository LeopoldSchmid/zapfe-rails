service: zapfe_rails
image: leopoldschmid/zapfe-rails

servers:
  web:
    hosts:
      - 157.180.19.232
    options:
      memory: 768m
      cpus: 1.5
  job:
    hosts:
      - 157.180.19.232
    cmd: bin/jobs
    options:
      memory: 512m
      cpus: 1.0

proxy:
  hosts:
    - zapfe.jetzt
    - www.zapfe.jetzt
  ssl: true
  app_port: 3000

registry:
  username: leopoldschmid
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - RESEND_API_KEY
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_SUBJECT
    - UMAMI_WEBSITE_ID
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    APP_HOST: zapfe.jetzt
    # Fail closed until the provider/transfer/retention and §25 TDDDG / Art. 6
    # review in the operator pack has been signed off.
    UMAMI_ENABLED: false
    UMAMI_SCRIPT_URL: https://analytics.duzend.net/script.js
    UMAMI_DOMAINS: zapfe.jetzt,www.zapfe.jetzt

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "zapfe_rails_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "zapfe-deploy") %>
