# Staging overlay for Kamal.
# Use with:
#   script/kamal_with_env deploy -d staging
#   script/kamal_with_env app logs -d staging

service: zapfe-rails-staging

proxy:
  hosts:
    - staging.zapfe.duzend.net
  ssl: true

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - RESEND_API_KEY
    - UMAMI_WEBSITE_ID
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    SOLID_QUEUE_IN_PUMA: true
    APP_HOST: staging.zapfe.duzend.net
    UMAMI_ENABLED: true
    UMAMI_SCRIPT_URL: https://analytics.duzend.net/script.js
    UMAMI_DOMAINS: staging.zapfe.duzend.net
    CUSTOMER_DOCUMENT_DELIVERY_ENABLED: false

volumes:
  - "zapfe_rails_staging_storage:/rails/storage"
