# Isolated OVH target. The existing config/deploy.yml continues to operate Hetzner.
service: zapfe_rails
image: leopoldschmid/zapfe-rails

servers:
  web:
    hosts:
      - ovh-deploy-zapfe
    options:
      memory: 768m
      cpus: 1.5
  job:
    hosts:
      - ovh-deploy-zapfe
    cmd: bin/jobs
    options:
      memory: 512m
      cpus: 1.0

# Initial validation stays private: no public DNS or TLS certificate request yet.
proxy:
  hosts:
    - zapfe.jetzt
    - www.zapfe.jetzt
  ssl: false
  app_port: 3000

registry:
  username: leopoldschmid
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - RESEND_API_KEY
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_SUBJECT
    - UMAMI_WEBSITE_ID
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    APP_HOST: zapfe.jetzt
    UMAMI_ENABLED: false
    UMAMI_SCRIPT_URL: https://analytics.duzend.net/script.js
    UMAMI_DOMAINS: zapfe.jetzt,www.zapfe.jetzt

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "zapfe_rails_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: deploy-zapfe
  keys:
    - /home/leo/.ssh/ovh_deploy_zapfe_ed25519
